name: CI

on:
  pull_request:

jobs:
  test:
    # Pinned rather than `ubuntu-latest`, which migrates to Ubuntu 26 from 2026-10-19: a publish
    # that carries provenance should not have its runner image change underneath it unannounced.
    # Moving to `ubuntu-26.04` is a deliberate change to make once, on a PR whose CI proves it.
    runs-on: ubuntu-24.04
    env:
      DS_VIEWER_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # `--experimental-strip-types` (every test/build command below) requires Node 22.6+ — it
          # was never backported to 20.x. The published CLI's own `engines` stays `>=20.19.0`
          # (Task 1): end users run compiled `dist/cli/main.js`, which needs no type stripping.
          node-version: '22'
      - run: npm ci
      # `npm test` needs kit-host/node_modules for its @types/react and react-native type
      # roots (cli/__tests__/props.test.ts, sync.test.ts) — without this, every component vanishes
      # from the catalog's test fixtures and `const [button] = []` throws (Important finding 1).
      - run: npm ci --prefix kit-host
      - run: npm ci --prefix viewer-host
      - run: npm test
      # Renders catalog components into jsdom through react-native-web. This catches wiring
      # defects (which element wraps what) that `npm test`'s source-text assertions cannot see.
      # It proves no geometry — jsdom has no layout engine — so `check:catalog`'s real browser
      # pass remains the only check for position and size.
      - run: npm run test:render
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:types
      # ubuntu-latest (24.04) blocks unprivileged user namespaces through AppArmor, so headless
      # Chrome cannot start its sandbox. Lift the restriction on the runner instead of passing
      # --no-sandbox, so the check runs Chrome exactly as on a developer machine.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run check:catalog
      - run: npm run check:doctor
